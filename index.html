<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<title>霍兰德兴趣探索</title>
<meta name="description" content="从你自然喜欢的事情里，发现自己与世界互动的方式">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%231f2d5c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23b8262b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=20261011b">
</head>
<body>
<div class="app">

  <!-- 首页（含昵称录入） -->
  <main id="v-home" class="view">
    <div class="deco-stars" aria-hidden="true"><i class="s1">✦</i><i class="s2">✦</i></div>
    <p class="kicker"><span></span>从兴趣出发 · 重新认识自己<span></span></p>
    <h1 class="title"><span class="navy">霍兰德</span><span class="red">兴趣探索</span></h1>
    <p class="subtitle" id="home-sub"></p>
    <div class="pill" id="home-tag"></div>
    <section class="card intro">
      <div class="intro-hex" id="home-hex"></div>
      <div class="intro-text" id="home-intro"></div>
    </section>
    <section class="card startcard">
      <div class="resume" id="resume" hidden>
        <p class="resume-t">你有一次还没完成的探索</p>
        <p class="resume-p" id="resume-pct"></p>
        <button type="button" class="btn btn-primary" id="btn-resume">继续作答</button>
      </div>
      <label class="nick-label" for="nick" id="nick-label"></label>
      <input id="nick" class="nick" type="text" maxlength="12" autocomplete="off" enterkeyhint="go">
      <p class="nick-hint" id="nick-hint"></p>
      <button type="button" class="btn btn-primary btn-start" id="btn-start" disabled></button>
      <ul class="meta" id="home-meta"></ul>
    </section>
    <button type="button" class="link-btn" id="btn-history-home">查看我的历史记录</button>
  </main>

  <!-- 作答说明 -->
  <main id="v-guide" class="view" hidden>
    <div class="deco-stars" aria-hidden="true"><i class="s1">✦</i><i class="s2">✦</i></div>
    <div class="pill small">✦ 作答之前 ✦</div>
    <section class="card guide" id="guide-text"></section>
    <button type="button" class="btn btn-primary" id="btn-guide-go"></button>
    <button type="button" class="link-btn" id="btn-guide-back">返回首页</button>
  </main>

  <!-- 作答页：不显示题量、不显示任何类型信息 -->
  <main id="v-quiz" class="view quiz" hidden>
    <div class="qtop">
      <button type="button" class="link-btn small" id="btn-pause">‹ 暂停，稍后继续</button>
      <span class="qbrand">霍兰德兴趣探索</span>
    </div>
    <div class="progress" aria-label="探索进度">
      <span class="pg-l" id="pg-label"></span>
      <div class="track"><i id="pg-bar"></i></div>
      <span class="pg-r" id="pg-pct"></span>
    </div>
    <section class="qcard" id="qcard">
      <p class="ask" id="q-ask"></p>
      <h2 class="qtext" id="q-text" aria-live="polite"></h2>
    </section>
    <div class="opts" id="opts" role="radiogroup"></div>
    <div class="qnav"><button type="button" class="link-btn" id="btn-prev">上一题</button></div>
  </main>

  <!-- 三个探索问题（不计分） -->
  <main id="v-explore" class="view" hidden>
    <div class="deco-stars" aria-hidden="true"><i class="s1">✦</i><i class="s2">✦</i></div>
    <div class="pill small">✦ 最后三个小问题 ✦</div>
    <p class="ex-intro" id="ex-intro"></p>
    <section class="card exq">
      <h3><span class="qn">1</span><span id="ex-q1"></span></h3>
      <textarea id="ex-a1" rows="3" maxlength="200"></textarea>
    </section>
    <section class="card exq">
      <h3><span class="qn">2</span><span id="ex-q2"></span><em class="mh"></em></h3>
      <div class="chips" id="ex-a2"></div>
      <input type="text" id="ex-a2o" maxlength="60">
    </section>
    <section class="card exq">
      <h3><span class="qn">3</span><span id="ex-q3"></span><em class="mh"></em></h3>
      <div class="chips" id="ex-a3"></div>
    </section>
    <button type="button" class="btn btn-primary" id="btn-submit"></button>
    <button type="button" class="link-btn" id="btn-ex-back">回到上一题</button>
  </main>

  <!-- 结果页 -->
  <main id="v-result" class="view result" hidden>
    <div class="deco-stars" aria-hidden="true"><i class="s1">✦</i><i class="s2">✦</i></div>
    <div id="report"></div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="btn-export">导出图片</button>
      <div class="actions-row">
        <button type="button" class="btn btn-ghost" id="btn-retest">重新测试</button>
        <button type="button" class="btn btn-ghost" id="btn-history">历史记录</button>
      </div>
    </div>
  </main>

  <!-- 历史记录 -->
  <main id="v-history" class="view" hidden>
    <div class="deco-stars" aria-hidden="true"><i class="s1">✦</i><i class="s2">✦</i></div>
    <h2 class="h2"><span class="navy">历史</span><span class="red">记录</span></h2>
    <p class="sub-note">记录只保存在这台设备的浏览器里。</p>
    <div id="hist-list"></div>
    <button type="button" class="btn btn-primary" id="btn-hist-home">回到首页</button>
    <button type="button" class="link-btn danger" id="btn-hist-clear">清空全部记录</button>
  </main>

  <div class="bottom-arc" aria-hidden="true">
    <svg viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 Q180 72 400 4 L400 60 L0 60Z" fill="#b8262b"/><path d="M0 42 Q200 76 400 26 L400 60 L0 60Z" fill="#1f2d5c"/></svg>
  </div>
</div>

<!-- 导出预览层（iOS / 微信等不支持直接下载时：长按保存） -->
<div class="overlay" id="overlay" hidden>
  <div class="ov-box">
    <p class="ov-tip" id="ov-tip">长按图片，保存到相册</p>
    <div class="ov-img"><img id="ov-img" alt="我的兴趣地图长图"></div>
    <button type="button" class="btn btn-primary" id="ov-close">关闭</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/questions.js?v=20261011b"></script>
<script src="js/content.js?v=20261011b"></script>
<script src="js/engine.js?v=20261011b"></script>
<script src="js/render.js?v=20261011b"></script>
<script src="js/report.js?v=20261011b"></script>
<script src="js/export.js?v=20261011b"></script>
<script src="js/app.js?v=20261011b"></script>
</body>
</html>
